<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回流路径动画 · 信号走到哪，回流就在哪一层跟着走</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --ink: #f1f5f9;
    --ink-muted: #94a3b8;
    --ink-dim: #64748b;
    --rule: #334155;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --mono: "Consolas", "Cascadia Mono", "Courier New", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7; font-size: 14px;
    padding-bottom: 60px;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px; }
  header { margin-bottom: 14px; }
  header h1 {
    font-size: 1.6rem;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; margin-bottom: 4px;
  }
  header p { color: var(--ink-muted); font-size: 13px; }
  header .links { margin-top: 6px; font-size: 12px; }
  header .links a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  header .links a:hover { text-decoration: underline; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button {
    font-family: inherit; font-size: 13px; border-radius: 7px; padding: 7px 13px;
    border: 1px solid var(--rule); background: var(--surface-2); color: var(--ink);
    cursor: pointer; transition: border-color .15s, background .15s, transform .1s;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.active {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1220; font-weight: 700; border-color: transparent;
  }
  .tlabel { color: var(--ink-dim); font-size: 12px; font-family: var(--mono); margin-right: 2px; }

  .grid { display: grid; grid-template-columns: minmax(430px, 1fr) minmax(340px, 430px); gap: 16px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  .panel h2 { font-size: 12px; font-family: var(--mono); letter-spacing: .05em;
              color: var(--accent-2); margin-bottom: 10px; }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: var(--mono); }

  .kv { font-family: var(--mono); font-size: 12.5px; color: var(--ink-muted); }
  .kv b { color: #a5f3fc; }
  .big { font-size: 15px; }
  .big .num { font-family: var(--mono); font-weight: 700; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }

  .verdict { border-left: 3px solid var(--rule); padding: 9px 12px; margin-bottom: 8px;
             border-radius: 0 8px 8px 0; background: rgba(148,163,184,.05); font-size: 13px; }
  .verdict.ok { border-left-color: var(--ok); }
  .verdict.warn { border-left-color: var(--warn); }
  .verdict.bad { border-left-color: var(--bad); background: rgba(248,113,113,.08); }

  .oneliner {
    text-align: center; font-size: 16px; padding: 12px; border-radius: 10px;
    background: linear-gradient(135deg, rgba(56,189,248,.12), rgba(129,140,248,.12));
    border: 1px solid var(--rule); color: var(--ink);
  }
  .oneliner b { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>回流路径动画 · 低频认电阻，高频认电感</h1>
    <p>师傅说：电流出去必回来，去的是信号线，回的是它正下方那层铜。低频时回流挑电阻最小的路（摊开走），高频时回流挑电感最小的路（贴着信号线正下方走）——跨分割毁的就是后半句。</p>
    <div class="links">
      <a href="../硬件学习路线图.html">← 返回总路线图</a>
      <a href="index.html">本关目录</a>
      <a href="stackup_lab.html">配套：叠层实验室</a>
    </div>
  </header>

  <div class="toolbar">
    <span class="tlabel">信号频率</span>
    <button id="f1k" onclick="setFreq('1k')">1 kHz 慢信号</button>
    <button id="f100m" onclick="setFreq('100m')">100 MHz 快信号</button>
    <span class="tlabel">参考平面</span>
    <button id="pInt" onclick="setPlane(true)">平面完整</button>
    <button id="pSplit" onclick="setPlane(false)">跨分割（地开槽）</button>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>PCB 剖面 · 顶层信号 / 底层参考平面（介质 1.6mm，比例已放大）</h2>
        <div id="svgBox"></div>
      </div>
      <div class="oneliner" id="oneliner"></div>
    </div>
    <div>
      <div class="panel">
        <h2>环路账本（辐射 ∝ 环路面积 × 频率²）</h2>
        <div id="ledger" class="kv big"></div>
      </div>
      <div class="panel">
        <h2>桥接电容有没有用？</h2>
        <div id="capAdvice"></div>
      </div>
      <div class="panel">
        <h2>老师傅讲解</h2>
        <div id="explain" class="kv"></div>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
var freq = '100m';
var planeIntact = true;

function setFreq(f) { freq = f; render(); }
function setPlane(v) { planeIntact = v; render(); }

/* 教学模型数字（口径写在讲解里，别当场求解器用） */
var TRACE_MM = 30;            // 信号线长 30mm
var H_MM = 1.6;               // 介质厚度
var SLOT_MM = 4;              // 分割缝宽
function detourMm() { return 18; }  // 绕行：从缝端头绕出去再回来，实测板子上常见 15~25mm

function model() {
  var fast = freq === '100m';
  var w = TRACE_MM;                                   // 环路宽 = 信号线长
  var h;            // 环路高 = 去回路径间距
  if (fast && planeIntact) h = H_MM;                  // 紧贴正下方：间距=介质厚
  else if (fast && !planeIntact) h = detourMm();      // 被迫绕缝端头：间距=绕行距离
  else h = fast ? H_MM : 6.0;                         // 低频：平面完整时回流摊开，等效间距放大
  if (!fast && !planeIntact) h = Math.max(6.0, detourMm() * 0.7);  // 低频跨缝：也绕但没那么夸张
  var area = w * h;
  var baseArea = w * H_MM;   // 基准：100MHz + 平面完整
  var areaX = area / baseArea;
  var f = fast ? 100e6 : 1e3;
  var fBase = 100e6;
  var dBArea = 10 * Math.log10(areaX);
  var dBFreq = 20 * Math.log10(f / fBase);
  var dbTotal = dBArea + dBFreq;
  return { fast: fast, w: w, h: h, area: area, areaX: areaX,
           dBArea: dBArea, dBFreq: dBFreq, dbTotal: dbTotal };
}

function render() {
  document.getElementById('f1k').className = freq === '1k' ? 'active' : '';
  document.getElementById('f100m').className = freq === '100m' ? 'active' : '';
  document.getElementById('pInt').className = planeIntact ? 'active' : '';
  document.getElementById('pSplit').className = planeIntact ? '' : 'active';
  var m = model();
  renderSvg(m);
  renderLedger(m);
  renderCap(m);
  renderExplain(m);
  var ol = document.getElementById('oneliner');
  ol.innerHTML = planeIntact
    ? '一句话记住：<b>信号线走到哪，回流就在哪一层跟着走</b>——贴着正下方。'
    : '一句话记住：信号线走到哪，回流就在哪一层跟着走——<b>你把地板凿开，它绕远路，账单寄到 EMC 测试间</b>。';
}

function renderSvg(m) {
  var W = 800, H = 430;
  var x0 = 60, x1 = 740;
  var ySig = 90, yGnd = 240;
  var slotCx = 430, slotHalf = 26;   // 分割缝（画面放大显示）
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';
  s += '<defs>' +
       '<marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/></marker>' +
       '<marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f87171"/></marker>' +
       '<marker id="arrY" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#fbbf24"/></marker>' +
       '</defs>';
  /* 介质 */
  s += '<rect x="' + x0 + '" y="' + (ySig + 8) + '" width="' + (x1 - x0) + '" height="' + (yGnd - ySig - 16) + '" fill="#1a2436" stroke="#334155"/>';
  s += '<text x="' + (x0 + 8) + '" y="' + (ySig + 30) + '" fill="#64748b" font-size="11">FR4 介质 1.6mm（垂直比例放大）</text>';
  /* 顶层信号线 */
  s += '<rect x="' + x0 + '" y="' + (ySig - 5) + '" width="' + (x1 - x0) + '" height="10" fill="#e8a15c" rx="2"/>';
  s += '<text x="' + x0 + '" y="' + (ySig - 14) + '" fill="#e8a15c" font-size="12">顶层信号线（源 → 负载）</text>';
  s += '<line x1="' + (x0 + 10) + '" y1="' + ySig + '" x2="' + (x1 - 20) + '" y2="' + ySig +
       '" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrC)"/>';
  /* 源 */
  s += '<rect x="' + (x0 - 34) + '" y="' + (ySig - 20) + '" width="30" height="40" fill="#334155" stroke="#64748b" rx="4"/>';
  s += '<text x="' + (x0 - 19) + '" y="' + (ySig + 4) + '" fill="#94a3b8" font-size="10" text-anchor="middle">IC</text>';

  /* 底层平面 */
  if (planeIntact) {
    s += '<rect x="' + x0 + '" y="' + yGnd + '" width="' + (x1 - x0) + '" height="12" fill="#38bdf8" opacity="0.85" rx="2"/>';
    s += '<text x="' + x0 + '" y="' + (yGnd + 32) + '" fill="#38bdf8" font-size="12">底层完整地平面</text>';
  } else {
    s += '<rect x="' + x0 + '" y="' + yGnd + '" width="' + (slotCx - slotHalf - x0) + '" height="12" fill="#38bdf8" opacity="0.85" rx="2"/>';
    s += '<rect x="' + (slotCx + slotHalf) + '" y="' + yGnd + '" width="' + (x1 - slotCx - slotHalf) + '" height="12" fill="#38bdf8" opacity="0.85" rx="2"/>';
    s += '<text x="' + (slotCx) + '" y="' + (yGnd + 30) + '" fill="#f87171" font-size="11" text-anchor="middle">分割缝 ' + SLOT_MM + 'mm</text>';
    /* 信号跨越分割的位置指示 */
    s += '<line x1="' + slotCx + '" y1="' + (ySig - 26) + '" x2="' + slotCx + '" y2="' + (yGnd + 44) +
         '" stroke="#f87171" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>';
    s += '<text x="' + slotCx + '" y="' + (ySig - 32) + '" fill="#f87171" font-size="11" text-anchor="middle">信号在这里跨过分割！</text>';
  }

  /* 回流路径 */
  if (planeIntact) {
    if (m.fast) {
      /* 100MHz：紧贴信号正下方一条窄带 */
      s += '<rect x="' + x0 + '" y="' + (yGnd - 1) + '" width="' + (x1 - x0) + '" height="6" fill="#fbbf24" opacity="0.95"/>';
      s += '<line x1="' + (x1 - 24) + '" y1="' + (yGnd + 2) + '" x2="' + (x0 + 24) + '" y2="' + (yGnd + 2) +
           '" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrY)"/>';
      s += '<text x="' + (x0 + 10) + '" y="' + (yGnd - 8) + '" fill="#fbbf24" font-size="12">100MHz 回流：挤在信号线正下方窄窄一条（互感最大、环路最小）</text>';
      /* 环路高度标注 */
      s += '<line x1="' + 680 + '" y1="' + (ySig + 6) + '" x2="680" y2="' + (yGnd - 2) + '" stroke="#4ade80" stroke-width="1"/>';
      s += '<text x="688" y="' + ((ySig + yGnd) / 2) + '" fill="#4ade80" font-size="11">环路高=1.6mm</text>';
    } else {
      /* 1kHz：均匀铺开 */
      for (var i = 0; i < 7; i++) {
        var xx = x0 + 30 + i * 100;
        s += '<line x1="' + (xx + 60) + '" y1="' + (yGnd + 5) + '" x2="' + (xx - 30) + '" y2="' + (yGnd + 5) +
             '" stroke="#fbbf24" stroke-width="2" opacity="0.55" marker-end="url(#arrY)"/>';
      }
      s += '<text x="' + (x0 + 10) + '" y="' + (yGnd - 8) + '" fill="#fbbf24" font-size="12">1kHz 回流：均匀摊开在整个平面（各并联路径电阻差不多，按电阻分）</text>';
      s += '<text x="' + (x0 + 10) + '" y="' + (yGnd - 26) + '" fill="#94a3b8" font-size="11">低频下跨不跨分割无所谓——这就是"慢信号可以过缝"的底气（但别养成习惯）</text>';
    }
  } else {
    /* 跨分割：绕行长环路 */
    var yDet = yGnd + 118;
    var leftX = x0 + 20, rightX = x1 - 20;
    var downX = slotCx - slotHalf - 42, upX = slotCx + slotHalf + 42;
    s += '<path d="M ' + (x0 + 8) + ' ' + (ySig + 6) + ' L ' + downX + ' ' + (ySig + 6) +
         ' L ' + downX + ' ' + yDet + ' L ' + upX + ' ' + yDet + ' L ' + upX + ' ' + (yGnd + 6) +
         '" fill="none" stroke="#f87171" stroke-width="3.5" marker-end="url(#arrR)"/>';
    /* 信号段高亮 */
    s += '<rect x="' + (x0 + 8) + '" y="' + (ySig - 6) + '" width="' + (upX - x0 - 8) + '" height="12" fill="#f87171" opacity="0.35" rx="3"/>';
    /* 环路面积阴影 */
    s += '<path d="M ' + (x0 + 8) + ' ' + ySig + ' L ' + upX + ' ' + ySig + ' L ' + upX + ' ' + yDet +
         ' L ' + downX + ' ' + yDet + ' L ' + downX + ' ' + ySig + ' Z" fill="rgba(248,113,113,0.13)" stroke="none"/>';
    s += '<text x="' + ((downX + upX) / 2) + '" y="' + (yDet + 20) + '" fill="#f87171" font-size="12" text-anchor="middle">回流绕行：出 → 绕缝端头 → 回，红色大环 = 环形天线</text>';
    s += '<text x="' + (x0 + 10) + '" y="' + (ySig + 62) + '" fill="#f87171" font-size="12">环路高从 ' + H_MM + 'mm 恶化到 ≈' + detourMm() + 'mm</text>';
  }

  /* 俯视小图 */
  var fy = 330;
  s += '<text x="' + x0 + '" y="' + (fy - 12) + '" fill="#64748b" font-size="11">俯视：红色 = 高频等效电流环（天线）</text>';
  if (planeIntact && m.fast) {
    s += '<rect x="' + x0 + '" y="' + fy + '" width="' + (x1 - x0) + '" height="8" fill="#e8a15c" rx="2"/>';
    s += '<rect x="' + x0 + '" y="' + (fy + 12) + '" width="' + (x1 - x0) + '" height="8" fill="#fbbf24" rx="2"/>';
    s += '<text x="' + (x1 + 4) + '" y="' + (fy + 14) + '" fill="#4ade80" font-size="11">环路瘦成一条缝：辐射小</text>';
  } else if (!planeIntact) {
    s += '<rect x="' + x0 + '" y="' + fy + '" width="' + (x1 - x0) + '" height="8" fill="#e8a15c" rx="2"/>';
    s += '<path d="M ' + (x0 + 8) + ' ' + (fy + 4) + ' L ' + (slotCx - 60) + ' ' + (fy + 4) +
         ' L ' + (slotCx - 60) + ' ' + (fy + 66) + ' L ' + (slotCx + 60) + ' ' + (fy + 66) +
         ' L ' + (slotCx + 60) + ' ' + (fy + 4) + '" fill="rgba(248,113,113,0.15)" stroke="#f87171" stroke-width="2.5"/>';
    s += '<text x="' + (slotCx + 80) + '" y="' + (fy + 44) + '" fill="#f87171" font-size="11">大环：面积 × N 倍</text>';
  } else {
    s += '<rect x="' + x0 + '" y="' + fy + '" width="' + (x1 - x0) + '" height="8" fill="#e8a15c" rx="2"/>';
    s += '<rect x="' + x0 + '" y="' + (fy + 12) + '" width="' + (x1 - x0) + '" height="26" fill="#fbbf24" opacity="0.5" rx="2"/>';
    s += '<text x="' + (x1 + 4) + '" y="' + (fy + 26) + '" fill="#94a3b8" font-size="11">低频摊开：环路大但 f² 项小</text>';
  }
  s += '</svg>';
  document.getElementById('svgBox').innerHTML = s;
}

function renderLedger(m) {
  var cls = m.dbTotal > -20 ? 'bad' : (m.dbTotal > -60 ? 'warn' : 'ok');
  var h = document.getElementById('ledger');
  h.innerHTML =
    '工况：<b>' + (m.fast ? '100 MHz' : '1 kHz') + '</b> ＋ <b>' + (planeIntact ? '平面完整' : '跨分割') + '</b><br>' +
    '信号线长 <b>' + m.w + ' mm</b> × 环路高 <b>' + m.h.toFixed(1) + ' mm</b> → 环路面积 <b>' +
    m.area.toFixed(0) + ' mm²</b><br>' +
    '相对基准（100MHz·平面完整，面积 ' + (TRACE_MM * H_MM).toFixed(0) + ' mm²）：<br>' +
    '· 面积增大 <b>' + m.areaX.toFixed(1) + ' 倍</b> → 辐射 <b class="' + (m.dBArea >= 0 ? 'bad' : 'ok') + '">' +
    (m.dBArea >= 0 ? '+' : '') + m.dBArea.toFixed(1) + ' dB</b>（辐射 ∝ 面积）<br>' +
    '· 频率降到 1 kHz → 辐射 <b class="ok">' + m.dBFreq.toFixed(0) + ' dB</b>（辐射 ∝ 频率²，20·log₁₀）<br>' +
    '合计相对基准：<b class="' + cls + '">' + (m.dbTotal >= 0 ? '+' : '') + m.dbTotal.toFixed(1) + ' dB</b>' +
    '<br><span style="font-size:11.5px;color:var(--ink-dim)">口径：短环路近似 E ∝ 面积×f²，只用于"差多少个数量级"的判断，别拿去和暗室报告对数。</span>';
}

function renderCap(m) {
  /* 桥接电容自谐振：0402 1nF，ESL≈0.5nH → f0≈225MHz；100nF → ≈50MHz */
  var lines = [];
  var f0_1n = 1 / (2 * Math.PI * Math.sqrt(0.5e-9 * 1e-9));
  var fSigMax = m.fast ? 600e6 : 10e3;   // 100MHz 时钟的有效谐波按 ~600MHz 算
  if (planeIntact) {
    lines.push('<div class="verdict ok"><b>没跨分割，不需要桥接电容。</b><br>别在完整地上"预防性挖槽"，那才是灾难的开始。</div>');
  } else if (!m.fast) {
    lines.push('<div class="verdict ok"><b>1 kHz 慢信号 + 桥接电容：有用。</b><br>低频电流认电阻，一颗 10µF/100nF 跨缝摆过去，电阻路径就接上了，代价小。</div>');
  } else {
    lines.push('<div class="verdict bad"><b>100 MHz 快信号 + 桥接电容：救不回来。</b><br>' +
      '1nF 电容自谐振约 ' + (f0_1n / 1e6).toFixed(0) + 'MHz，对 100MHz 基波勉强算导线，但对真正伤人的 2~6 次谐波（200~600MHz）它就是颗电感。<br>' +
      '跨缝处补电容只把"断路"变成"窄路"，环路面积仍然比正下方大一个数量级。</div>');
    lines.push('<div class="verdict warn"><b>正解排序：</b>① 别跨（把线挪回完整区域，成本为零）；' +
      '② 非跨不可时在缝两侧打<b>相邻回流地孔</b>让换层回流有梯子；' +
      '③ 桥接电容只当缓解项，缝两侧各一孔一容，且离跨越点越近越好。</div>');
  }
  document.getElementById('capAdvice').innerHTML = lines.join('');
}

function renderExplain(m) {
  var t = [];
  if (planeIntact && !m.fast) {
    t.push('· 1kHz 时电容电感都"不起眼"，电流按电阻分家：平面各条路径电阻差不多，回流就均匀摊开。');
    t.push('· 这时候你在地上开槽，电流只是绕几步，功率损耗变化都不大——"慢信号别太紧张"。');
  }
  if (planeIntact && m.fast) {
    t.push('· 100MHz 时每条路径的电阻差异不大，但<b>电感</b>差异巨大：离信号线越远，环路越大，电感越大。');
    t.push('· 高频电流是"懒人"，专挑电感最小的路——也就是信号正下方：互感最大，自己的回路被对面来的回流抵消。');
    t.push('· 所以去耦半径、3W、包地这些规则，根子上都在管"环路面积"这一件事。');
  }
  if (!planeIntact) {
    t.push('· 信号跨过分割缝，回流到缝前"没路了"，只能从缝的端头绕过去——环路从 1.6mm 高暴涨到十几 mm 高。');
    t.push('· 大环 = 环形天线：发射（辐射超标）和接收（对外来的干扰更敏感）是同一个天线的两个用法。');
    t.push('· 顺带一句：跨分割还让特征阻抗突变（回流路径变长→电感增大→Z0 尖峰），信号完整性一起买单。');
  }
  t.push('· 口诀：<b>信号线走到哪，回流就在哪一层跟着走</b>。布线前先看脚下（参考层），再动手画线。');
  document.getElementById('explain').innerHTML = t.join('<br>');
}

render();
</script>
